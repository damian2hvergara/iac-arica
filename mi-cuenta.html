<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Stickers | IAC Arica 2026 — No Sueñes, Gánatelo</title>
<meta name="description" content="Consulta con tu correo todos tus Stickers Digitales y números de participación en el sorteo IAC Arica 2026.">
<link rel="canonical" href="https://iac-arica.cl/mi-cuenta.html">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--red:#9B0000;--bg:#0C0C0C;--surface:#161616;--surface-2:#202020;--border:rgba(255,255,255,0.08);--border-hi:rgba(255,255,255,0.14);--text:#F2F2F2;--muted:#9c9689;--gold:#F0D080;--green:#00C566;--orange:#F59E0B;--danger:#ff3b30;--font-h:'Barlow Condensed',sans-serif;--font-b:'DM Sans',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);line-height:1.6;font-size:15px}
a{color:var(--gold)}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit;font-size:15px}
.topbar{position:sticky;top:0;z-index:10;background:rgba(12,12,12,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--font-h);font-weight:700;font-size:16px}
.brand span{color:var(--red)}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.wrap{max-width:480px;margin:0 auto;padding:50px 20px 70px}
h1{font-family:var(--font-h);font-size:clamp(24px,5vw,30px);text-transform:uppercase;text-align:center}
.sub{color:var(--muted);font-size:13.5px;text-align:center;margin-top:8px;margin-bottom:26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{width:100%;padding:12px 13px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:8px;color:var(--text)}
.field input:focus{outline:none;border-color:var(--red)}
.submit-btn{width:100%;padding:14px;background:var(--red);color:#fff;border-radius:999px;font-family:var(--font-h);font-size:16px;font-weight:700;text-transform:uppercase;margin-top:6px}
.submit-btn:disabled{opacity:.5}
.err{color:var(--danger);font-size:13px;text-align:center;margin-top:14px;display:none}
.result{display:none;margin-top:26px;display:flex;flex-direction:column;gap:14px}
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.pill-pend{background:rgba(245,158,11,0.16);color:var(--orange)}
.pill-ok{background:rgba(0,197,102,0.16);color:var(--green)}
.pill-rej{background:rgba(255,59,48,0.16);color:var(--danger)}
.order-name{font-family:var(--font-h);font-size:19px;margin-top:12px}
.order-meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.folio-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.folio-item{background:var(--surface-2);border:1px solid var(--border-hi);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.folio-item img{width:52px;height:38px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--surface)}
.folio-item .info{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.folio-item .code{font-family:'SFMono-Regular',Consolas,monospace;font-weight:700;color:var(--gold)}
.folio-item .bonus{font-size:10px;color:var(--green);text-transform:uppercase}
.folio-item.is-bonus{background:linear-gradient(135deg,rgba(0,197,102,0.12),var(--surface-2));border-color:rgba(0,197,102,0.4)}
.folio-item.is-bonus .gift-ico{width:52px;height:38px;border-radius:6px;flex-shrink:0;background:rgba(0,197,102,0.15);border:1px solid rgba(0,197,102,0.4);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:16px}
.folio-item.is-bonus .bonus{background:rgba(0,197,102,0.16);padding:3px 8px;border-radius:20px;font-weight:700}
.order-pending-note{margin-top:12px;color:var(--muted);font-size:12.5px}
.resend-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:11px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:8px;color:var(--text);font-size:13px;font-weight:600}
.resend-btn:active{background:var(--surface)}
.resend-btn:disabled{opacity:.5}
.resend-msg{font-size:11.5px;text-align:center;margin-top:8px;min-height:14px}
.resend-msg.ok{color:var(--green)}
.resend-msg.err{color:var(--danger)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">IAC <span>Arica</span> 2026</div>
  <a class="back" href="stamper.html"><i class="fas fa-arrow-left"></i> Volver al sorteo</a>
</div>

<div class="wrap">
  <h1>Mis Stickers</h1>
  <p class="sub">Ingresa el correo con el que compraste y te mostramos todos tus números de participación.</p>

  <div class="field">
    <label>Correo electrónico</label>
    <input id="inEmail" type="email" placeholder="tucorreo@ejemplo.com">
  </div>

  <button class="submit-btn" id="searchBtn">Buscar mis stickers</button>
  <div class="err" id="errMsg"></div>

  <div class="result" id="result"></div>

  <p style="text-align:center;margin-top:26px;font-size:12.5px;color:var(--muted)">
    ¿Referiste amigos? <a href="mis-referidos.html">Ve tu ranking y cuánto te falta para el premio →</a>
  </p>
</div>

<script src="js/config.js?v=20260823a"></script>
<script src="js/stamper-api.js?v=20260823a"></script>
<script>
document.getElementById('searchBtn').addEventListener('click', buscar);
document.getElementById('inEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') buscar(); });

async function buscar() {
  const email = document.getElementById('inEmail').value.trim();
  const errEl = document.getElementById('errMsg');
  const resultEl = document.getElementById('result');
  errEl.style.display = 'none';
  resultEl.style.display = 'none';
  resultEl.innerHTML = '';

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errEl.textContent = 'Ingresa un correo válido.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = 'Buscando…';

  try {
    const res = await fetch(`${SUPABASE_CONFIG.url}/functions/v1/lookup-stickers-by-email`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_CONFIG.anonKey}` },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!data.ok) {
      errEl.textContent = data.error || 'No encontramos compras con ese correo.';
      errEl.style.display = 'block';
      return;
    }
    renderResultado(email, data.ordenes);
  } catch (e) {
    console.error(e);
    errEl.textContent = 'No pudimos hacer la búsqueda. Intenta de nuevo.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Buscar mis stickers';
  }
}

const ESTADOS = {
  pendiente_pago: { label: 'Pendiente de pago', cls: 'pill-pend' },
  completado: { label: 'Confirmado', cls: 'pill-ok' },
  rechazado: { label: 'Rechazado', cls: 'pill-rej' },
  reembolsado: { label: 'Reembolsado', cls: 'pill-pend' }
};

// Distinción simple entre comprado / bono por referido / regalo por redes —
// para que "Mis Stickers" no muestre "Sin pack · $0" en los que no son compras.
const TIPOS = {
  gratis_redes_sociales: '🎁 Regalo por redes sociales',
  bonus_referido: '🎁 Bono por referido'
};

function renderResultado(email, ordenes) {
  const result = document.getElementById('result');
  result.innerHTML = ordenes.map((o, oi) => {
    const info = ESTADOS[o.estado] || { label: o.estado, cls: 'pill-pend' };
    const images = o.vehicleImages || [];
    const fecha = o.fecha ? new Date(o.fecha).toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

    const esGratisOBono = o.tipo === 'gratis_redes_sociales' || o.tipo === 'bonus_referido';

    let folioListHtml;
    if (o.folios && o.folios.length) {
      folioListHtml = `<div class="folio-list">` + o.folios.map((f) => {
        const marcado = f.es_bonus || esGratisOBono;
        const img = pickStickerImageForFolio(images, f.numero_folio);
        const imgHtml = marcado
          ? `<div class="gift-ico"><i class="fas fa-gift"></i></div>`
          : (img ? `<img src="${img}" alt="Foto de ${escapeHtml(o.vehicleName || 'tu premio')}">` : '');
        return `
        <div class="folio-item ${marcado ? 'is-bonus' : ''}">
          ${imgHtml}
          <div class="info">
            <span class="code">${escapeHtml(f.numero_folio)}</span>
            ${f.es_bonus ? '<span class="bonus">🎁 Gratis · Bono referido</span>' : ''}
            ${(!f.es_bonus && o.tipo === 'gratis_redes_sociales') ? '<span class="bonus">🎁 Gratis · Regalo por redes</span>' : ''}
          </div>
        </div>`;
      }).join('') + `</div>`;
    } else if (o.estado === 'pendiente_pago') {
      folioListHtml = `<div class="order-pending-note">Tus folios aparecerán aquí apenas se confirme tu pago.</div>`;
    } else {
      folioListHtml = '';
    }

    const resendHtml = o.estado === 'completado' ? `
      <button class="resend-btn" data-orden-id="${escapeHtml(o.ordenId)}" data-idx="${oi}">
        <i class="fas fa-paper-plane"></i> Reenviar por correo
      </button>
      <div class="resend-msg" id="resendMsg-${oi}"></div>
    ` : '';

    const nombreOrden = TIPOS[o.tipo] || o.pack || 'Sticker Digital';
    const montoTexto = esGratisOBono ? 'Sin costo' : `$${Number(o.monto_total).toLocaleString('es-CL')}`;

    return `
    <div class="order-card">
      <span class="pill ${info.cls}">${info.label}</span>
      <div class="order-name">${escapeHtml(nombreOrden)}</div>
      <div class="order-meta">${o.cantidad_stickers} stickers · ${montoTexto} · ${fecha}</div>
      ${folioListHtml}
      ${resendHtml}
    </div>`;
  }).join('');

  result.style.display = 'flex';

  result.querySelectorAll('.resend-btn').forEach(btn => {
    btn.addEventListener('click', () => reenviarCorreo(email, btn.dataset.ordenId, btn.dataset.idx, btn));
  });
}

async function reenviarCorreo(email, ordenId, idx, btn) {
  const msgEl = document.getElementById('resendMsg-' + idx);
  msgEl.textContent = '';
  msgEl.className = 'resend-msg';
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando…';

  try {
    const res = await fetch(`${SUPABASE_CONFIG.url}/functions/v1/resend-stamp-email`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_CONFIG.anonKey}` },
      body: JSON.stringify({ email, ordenId })
    });
    const data = await res.json();
    if (data.ok) {
      msgEl.textContent = '✅ Te lo reenviamos — revisa tu correo (y spam).';
      msgEl.classList.add('ok');
    } else {
      msgEl.textContent = data.error || 'No pudimos reenviar el correo.';
      msgEl.classList.add('err');
    }
  } catch (e) {
    console.error(e);
    msgEl.textContent = 'No pudimos reenviar el correo. Intenta de nuevo.';
    msgEl.classList.add('err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Reenviar por correo';
  }
}
</script>
</body>
</html>
